[build]
  publish = "public"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  included_files = ["views/**", "prisma/**", "data/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
